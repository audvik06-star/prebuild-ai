<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PreBuild AI</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <meta name="theme-color" content="#000000" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 14px;
    }
    #splash p {
      color: #F8FAFC;
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.4px;
    }
    #install-banner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: #111827;
      border: 1px solid #FFFFFF;
      border-radius: 14px;
      padding: 12px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 9998;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.75);
    }
    #install-banner span {
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
    }
    .banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #install-btn {
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    #close-banner {
      background: transparent;
      color: #9CA3AF;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100dvh;
      display: block;
      background-color: #000000;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icon.png" alt="PreBuild AI" />
    <p>PreBuild AI</p>
  </div>

  <div id="install-banner">
    <span>📲 Install PreBuild AI App</span>
    <div class="banner-actions">
      <button id="install-btn">Install</button>
      <button id="close-banner" aria-label="Close">✕</button>
    </div>
  </div>

  <iframe id="app-frame" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    function getDeviceId() {
      let id = localStorage.getItem("prebuild_device_id");
      if (!id) {
        if (window.crypto && crypto.randomUUID) {
          id = crypto.randomUUID();
        } else {
          id = "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2, 11);
        }
        localStorage.setItem("prebuild_device_id", id);
      }
      return id;
    }

    const deviceId = getDeviceId();
    const frame = document.getElementById("app-frame");
    const splash = document.getElementById("splash");

    frame.src =
      "https://prebuild-ai.streamlit.app/?embed=true&device_id=" +
      encodeURIComponent(deviceId);

    frame.addEventListener("load", () => {
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
      }, 350);
    });

    setTimeout(() => {
      if (splash.style.display !== "none") {
        splash.style.display = "none";
      }
    }, 6000);

    let deferredPrompt = null;
    const banner = document.getElementById("install-banner");
    const installBtn = document.getElementById("install-btn");
    const closeBtn = document.getElementById("close-banner");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      banner.style.display = "flex";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = "none";
    });

    closeBtn.addEventListener("click", () => {
      banner.style.display = "none";
    });

    window.addEventListener("appinstalled", () => {
      banner.style.display = "none";
    });
  </script>
</body>
</html>
